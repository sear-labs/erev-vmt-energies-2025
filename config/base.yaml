# Base case for Patil, Kumbhar & Jones, Energies 2025, 18, 6448.
#
# Every value here was a module-level constant in the original notebook
# (notebooks/2025-12-09-as-published.ipynb). Changing a scenario is an edit to
# this file or an overlay in scenarios/, never an edit to src/ and never a
# copy of the script. See the standard, Part 1 rule 2.
#
# FHWA monthly VMT is NOT here: it is measured input, not a knob, and lives in
# data/raw/fhwa_vmt_2023.csv with its own provenance sidecar.

year: 2023

# Table 1 in the paper is a single month.
month_to_show: 12

# Base case requires the battery to cover the trip out AND back, with no
# mid-trip charging. Setting this false gives the one-way relaxation.
round_trip: true

# Electric ranges evaluated, in miles.
ranges: [50, 75, 100, 125, 150]

# Scale each month's fitted VMT so the annual total matches FHWA exactly.
# The bin distances x_opt are fitted once across all months and are NOT
# refitted per month; this only rescales the result.
normalize_to_fhwa: true

# Bounds on the fitted average distance within each BTS trip-distance bin,
# in miles. The bounded least-squares fit cannot leave these, which is what
# keeps a bin's mean inside the bin it came from. The open-ended 500+ bin is
# capped at 1000 by assumption -- see README, "Stated residuals".
bin_bounds:
  "0-1":     [0.25, 1.0]
  "1-3":     [1.0, 3.0]
  "3-5":     [3.0, 5.0]
  "5-10":    [5.0, 10.0]
  "10-25":   [10.0, 25.0]
  "25-50":   [25.0, 50.0]
  "50-100":  [50.0, 100.0]
  "100-250": [100.0, 250.0]
  "250-500": [250.0, 500.0]
  "500+":    [500.0, 1000.0]

# Emissions, efficiency and cost factors.
emissions:
  mpg_gas: 26.2              # miles/gal, national average fuel economy
  co2_per_gal: 8887.0        # g CO2 per gallon of gasoline burned
  ev_kwh_per_mi: 0.29        # kWh drawn from the grid per electric mile
  grid_g_per_kwh: 387.0      # g CO2 per kWh, national average grid intensity

battery:
  eta_mi_per_kwh: 3.6        # mi/kWh used for pack sizing (pack = range / eta)
  pack_cost_per_kwh: 115.0   # $/kWh pack cost

fleet:
  avg_driver_miles: 13496.0  # miles/vehicle/year; fleet size = total VMT / this

# Charging-frequency ladder. Each level is a housing situation mapped to a
# number of charges per week. Weights over these levels come from ACS B25032
# (tenure by units in structure); see scenarios below.
charging:
  charges_per_week:
    none:     0.0
    errands:  0.5
    weekly:   1.0
    work:     3.0
    driveway: 5.0
    garage:   6.0
    everyday: 7.0

  # Order matters: the Low and More scenarios shift every household one step
  # down or up this ladder.
  level_order: [none, errands, weekly, work, driveway, garage, everyday]

  # Where the weights over charging levels come from.
  #
  #   published_fallback  what the published run ACTUALLY used
  #   acs_b25032          what the notebook INTENDED: derived from ACS B25032
  #
  # The default is published_fallback so that `run_all.py` reproduces the
  # paper. This is not an endorsement of it: the notebook's ACS lookup matched
  # zero variables and fell through to a hardcoded vector while only emitting a
  # warning. See README, "Scenario weights", and tests/test_acs_lookup.py,
  # which pins the cause.
  weights_source: published_fallback

  # The hardcoded vector the published run fell back to. Reproduced verbatim
  # from the notebook so the paper's scenario numbers can be regenerated.
  published_fallback_weights:
    garage:   0.45
    driveway: 0.25
    work:     0.20
    weekly:   0.10

  # ACS B25032 label patterns -> charging level. `units` must match the text
  # after the final "!!" in the Census variable label EXACTLY.
  #
  # Verified against api.census.gov on 2026-09-10. The categories are "2" and
  # "3 or 4", not "2 apartments" and "3 or 4 apartments"; the tenure text is
  # "Owner-occupied housing units", hyphenated. All three of those differed
  # from what the notebook searched for, which is why it matched nothing.
  acs_mapping:
    garage:
      - {tenure: owner,  units: "1, detached"}
    driveway:
      - {tenure: renter, units: "1, detached"}
      - {tenure: owner,  units: "1, attached"}
      - {tenure: owner,  units: "2"}
      - {tenure: owner,  units: "3 or 4"}
    work:
      - {tenure: renter, units: "1, attached"}
      - {tenure: owner,  units: "5 to 9"}
      - {tenure: owner,  units: "10 to 19"}
      - {tenure: owner,  units: "20 to 49"}
    weekly:
      - {tenure: renter, units: "2"}
      - {tenure: renter, units: "3 or 4"}
      - {tenure: owner,  units: "50 or more"}

# Scenarios reported in the paper. Base_EachTrip is the unconstrained case:
# every trip starts with a full battery.
scenarios: [Base_EachTrip, Low, Normal, More]

# ---------------------------------------------------------------------------
# Tables 4-6 and Figures 2-3, 5-13: the Fall 2025 workbook's model.
#
# Everything below was a cell in notebooks/fall-2025/Calculations Check_final.xlsx
# ('Calcs by Scenario' rows 25-48 and 'Calcs by Charge'), where the published tables
# and figures were computed. src/erev_vmtalloc/costs.py implements those formulas, and
# tests/test_workbook_agreement.py checks the result against the workbook's cached
# values cell by cell. Several values here differ from what the article PRINTS in
# Table 4; each is marked, and the README lists them under "What reproduces, and
# what doesn't". They are kept as the workbook had them because the published
# Tables 5-6 and Figures were computed with them.
paper_scenarios:
  # Ranges in Tables 5-6. 25 miles is in the tables but not in `ranges` above.
  ranges: [25, 50, 75, 100, 125, 150]

  # Battery range of the all-electric "EV" row (workbook S32 = 300 / mi_per_kWh).
  ev_row_range_mi: 300

  # Vehicles over which battery capacity is installed: the 2022 light-duty count
  # (workbook 'Calcs by Scenario'!T13). Table 4 prints "Vehicle Count 286.1 M
  # (Equation (1))", which Tables 5-6 did NOT use.
  vehicles: 257741217

  # Capital cost per kg or per mile is spread over this many years (workbook Y21).
  lifespan_years: 10

  # US households, millions (Table 4; workbook 'Trip Bin Distance'!H2). Table 3's
  # weekly trips per household divide by it.
  households_millions: 131.4

  # kg CO2 per gallon of gasoline. Table 4 prints 8.887; every row of the workbook
  # and every gas-emissions value in Table 5 uses 8.888.
  kg_co2_per_gal: 8.888

  # Table 4 prints fuel economy, grid intensity and electricity price in ascending
  # order under a "Worst/Average/Best" heading; for those three rows the printed
  # order is Best/Average/Worst. These are the values each scenario actually used.
  scenarios:
    Worst:
      mpg: 36.0
      mi_per_kwh: 2.9
      grid_g_per_kwh: 714.0
      pack_usd_per_kwh: 150.0   # Not in Table 4 at all; the text gives only 115.
      gas_usd_per_gal: 2.0
      elec_usd_per_kwh: 0.40
    Average:
      mpg: 26.4
      mi_per_kwh: 3.6
      grid_g_per_kwh: 348.0
      pack_usd_per_kwh: 115.0
      gas_usd_per_gal: 3.0
      elec_usd_per_kwh: 0.25
      # The workbook's Average "EV" row (cell AB40) holds 0.15, where every other
      # Average row holds 0.25. Table 6's Average EV operating cost (135.95, $0.042
      # per mile) was computed with it, and $0.042 matches the low end of the
      # conclusions' "4-8 cents/mi". Delete this line for the consistent value.
      elec_usd_per_kwh_ev_row: 0.15
    Best:
      mpg: 18.0
      mi_per_kwh: 4.2
      grid_g_per_kwh: 125.0
      pack_usd_per_kwh: 75.0    # Not in Table 4 at all.
      gas_usd_per_gal: 5.0
      elec_usd_per_kwh: 0.15

  # Charging frequency (Figures 5, 7, 9, 11, 13): Average scenario, nights per week.
  charging:
    frequencies: [7, 5, 3, 2]
    scenario: Average
    # Which annual VMT the charging results stand on.
    #
    #   table1_printed  what the published figures used: the sum of Table 1's printed
    #                   VMT column, 3,392.497 B. That is the fit before normalisation
    #                   to FHWA (3,385.0 B), plus the 0-1 mile bin's display rounding
    #                   from 0.25 to 0.3 miles (README, "Stated residuals" 3 and 4).
    #   normalized      what Tables 2-3 and 5-6 use: FHWA's 3,262.8 B
    #
    # The published figures mix the two: their CO2 and cost savings subtract an
    # emissions total on the 3,392.5 B base from an ICE baseline on the 3,262.8 B
    # base. The default reproduces the paper; `normalized` gives the consistent
    # version.
    vmt_basis: table1_printed

    # Gas VMT at 5, 3 and 2 charges a week.
    #
    # The workbook holds these as typed constants with no surviving generator. The
    # rule that produces all 18 of them (to within 3.4e-6, recovered 2026-10-07):
    #
    #   gas(k/week, R) = gas(7/week, R) + loss[k] * electric VMT at range R from
    #                    trips under 100 miles
    #
    # Charging less often loses a fixed share of short-trip electric miles. Trips of
    # 100 miles or more are unaffected, matching Section 4.6's "drivers ... would
    # charge before" a long trip. The three shares are the rule's only free
    # parameters; they were recovered from the published numbers, and no derivation
    # of them survives.
    #
    #   regenerated  apply the rule (default; it reproduces the paper)
    #   pasted       read the workbook's constants from `gas_vmt_file` instead
    gas_source: regenerated
    missed_charge_loss: {5: 0.15, 3: 0.30, 2: 0.40}
    long_trip_bins: ["100-250", "250-500", "500+"]
    gas_vmt_file: charging_gas_vmt_2023.csv

  # Figure 4: one household's week, day by day, at each range and charging pattern.
  #
  # The published notebook cell takes its weekly trips from variables it never
  # defines, so on its own it draws a hardcoded toy week. The inputs the published
  # figure used were recovered 2026-10-07, and each step reproduces a workbook column
  # exactly ('Trip Bin Distance' sheet):
  #
  #   trips per driver per month (F) = Table 1's December trips, as printed in
  #                                    billions to 3 dp, x 1000 / drivers_millions,
  #                                    to 4 dp
  #   trips per household per week (I) = F x 12 / weeks_per_year, to 4 dp
  #   weekly miles = sum over ALL ten bins of I x fitted bin distance
  #   day d's miles = weekly miles x day_weights[d] / sum(day_weights)
  #
  # That gives 71.6 miles each weekday and 76.7 each weekend day. The published
  # image measures 71.7 and 76.3, within its 0.4-mile pixel. Note "all ten bins":
  # Section 4.6 says trips over 100 miles were left out of the weekly profile, but
  # the published figure includes them; without them, weekdays would be 54.5 miles.
  weekly_profile:
    month: 12
    drivers_millions: 128.0
    weeks_per_year: 52.14
    day_weights: [0.14, 0.14, 0.14, 0.14, 0.14, 0.15, 0.15]   # Mon..Sun
    # Nights a battery is charged, 0 = Monday. Monday starts full.
    charge_nights: {7: [0, 1, 2, 3, 4, 5, 6], 5: [0, 1, 2, 3, 4], 3: [0, 2, 4], 2: [1, 4]}
    ranges: [50, 75, 100, 150]
