name: CI

# Part 1 rule 6: the clean machine matters more than the test count. This runs
# on a fresh runner with no cached environment and no network access to the
# federal APIs, which is what catches "works on my laptop" and what proves the
# frozen snapshots are sufficient to reproduce the paper.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src scripts tests

      - name: Reproduce the paper from a clean checkout
        run: python scripts/run_all.py

      - name: Test
        run: pytest -v

      - name: Confirm committed results still match a fresh run
        # The repository commits results/ on purpose. If a code change moves a
        # number, the committed copy and the fresh run diverge -- and a stale
        # committed result is worse than none, because it reads as current.
        run: |
          git diff --exit-code --stat results/ || {
            echo "::error::Committed results/ differ from a fresh run."
            echo "If the change is intended, commit the regenerated results."
            exit 1
          }
