name: CI

# Part 1 rule 6: the clean machine matters more than the test count. This runs
# on a fresh runner with no cached environment and no network access to the
# federal APIs, which is what catches "works on my laptop" and what proves the
# frozen snapshots are sufficient to reproduce the paper.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src scripts tests

      - name: Mark the start of the run
        # Every committed figure must be newer than this after run_all, or run_all
        # did not produce it.
        run: touch "$RUNNER_TEMP/run-start"

      - name: Reproduce the paper from a clean checkout
        run: python scripts/run_all.py

      - name: Test
        run: pytest -v

      - name: Confirm committed results still match a fresh run
        # The repository commits results/ on purpose. If a code change moves a
        # number, the committed copy and the fresh run diverge -- and a stale
        # committed result is worse than none, because it reads as current.
        #
        # Tables carry the numbers, so they are compared exactly. Figures are not:
        # a PNG rendered on this Linux runner is never byte-identical to one
        # rendered on the author's machine (fonts, libpng), so a byte comparison
        # failed on every run from 2026-09-10 with no number having moved. Instead
        # each committed figure must have been regenerated by this run, and the
        # run must not produce a figure that is not committed.
        run: |
          git diff --exit-code --stat -- results/ ':(exclude)results/figures/*.png' || {
            echo "::error::Committed results/ differ from a fresh run."
            echo "If the change is intended, commit the regenerated results."
            exit 1
          }
          stale=$(find results/figures -name '*.png' ! -newer "$RUNNER_TEMP/run-start")
          if [ -n "$stale" ]; then
            echo "::error::Committed figures that run_all no longer produces:"
            echo "$stale"
            exit 1
          fi
          new=$(git status --porcelain --untracked-files=all -- results/figures)
          new=$(printf '%s\n' "$new" | grep '^??' || true)
          if [ -n "$new" ]; then
            echo "::error::run_all produced figures that are not committed:"
            echo "$new"
            exit 1
          fi
